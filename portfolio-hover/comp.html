<!doctype html>
<!-- Le Bon Tempérament hover loop (8s, 1280x800). Real captures from www.lebontemperament.com; see capture.mjs. -->
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="base.css" />
<style>
  /* The site's own palette (apps/website/hero.ts): primary #1a878d, deep teal #0B3638. */
  :root { --teal: #1a878d; --deep: #0b3638; }
  .wipe { position: absolute; top: 0; bottom: 0; width: 1500px; left: -1500px; z-index: 30;
    background: var(--deep); box-shadow: 18px 0 0 var(--teal); }
  /* The site's round "LE BT" logo, cropped from the home capture and centred on the wipe. */
  .logo { position: absolute; left: 1500px; top: 400px; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 50%; transform: scale(2.6); background: url("captures/home.png") -33px -9px / 1280px 800px no-repeat; }
  .zoom { transform-origin: 0 0; }
  /* Cursors pass under the wipes. */
  .hv-cursor, .hv-click { z-index: 20; }
</style>
</head>
<body>
<div class="stage">
  <div class="layer" id="home"><img class="shot zoom" id="homeImg" src="captures/home.png" /></div>
  <div class="layer" id="agenda"><div id="agendaSeq"></div><img class="shot" id="agendaHover" src="captures/agenda-hover.png" /></div>
  <div class="layer" id="story"><div id="storySeq"></div></div>
  <div class="layer" id="gal">
    <img class="shot" src="captures/gal-0.png" />
    <img class="shot" id="galOpen" src="captures/gal-1.png" />
  </div>
  <div class="wipe" id="wipe"><div class="logo" id="logo"></div></div>
  <div class="hv-cursor" id="c1"></div><div class="hv-cursor" id="c2"></div><div class="hv-cursor" id="c3"></div>
</div>
<script src="engine.js"></script>
<script src="captures/layout.js"></script>
<script>
  const { tw, seg, keys, ease } = HV;
  const L = window.LAYOUT;
  const $ = (id) => document.getElementById(id);
  const center = (b) => [b.x + b.w / 2, b.y + b.h / 2];

  // Frame sequences: one real capture per video frame of each scroll, stacked and switched by opacity.
  const stack = (id, name) => {
    const n = L.seq[name];
    for (let i = 0; i < n; i++) {
      const img = document.createElement("img");
      img.className = "shot";
      img.src = `captures/${name}-${String(i).padStart(2, "0")}.jpg`;
      $(id).appendChild(img);
    }
    const imgs = [...$(id).children];
    return (t, start) => {
      const k = Math.min(n - 1, Math.max(0, Math.round((t - start) * 30)));
      imgs.forEach((img, i) => (img.style.opacity = i === k ? 1 : 0));
    };
  };
  const agendaAt = stack("agendaSeq", "agenda");
  const storyAt = stack("storySeq", "story");

  // Timeline (seconds).
  const HOME_OUT = 1.3, AGENDA_SCROLL = 1.75, CLICK_CARD = 3.4, STORY_IN = 3.75, STORY_SCROLL = 4.3;
  const GAL_IN = 5.45, CLICK_ACC = 6.0, HOME_BACK = 7.15;

  const [bx, by] = center(L.concertsBtn);
  const [kx, ky] = center(L.card);
  const [ax, ay] = [L.accordion.x + 150, L.accordion.y + L.accordion.h / 2];
  const cur1 = HV.cursor($("c1"), [[0.45, 1010, 700], [0.8, bx + 20, by + 6], [1.1, bx + 20, by + 6]], [0.85]);
  const cur2 = HV.cursor($("c2"), [[1.9, 760, 640], [2.95, 700, 600], [3.25, kx + 30, ky + 20], [3.6, kx + 30, ky + 20]], [CLICK_CARD]);
  const cur3 = HV.cursor($("c3"), [[5.65, 760, 600], [5.95, ax, ay], [6.9, ax + 10, ay + 150]], [CLICK_ACC]);

  /** A deep-teal panel with the teal edge sweeping across, fully covering the frame at `mid`. */
  const wipeX = (t, start, mid, end) =>
    t < start || t > end ? -1600 : t < mid ? tw(t, start, mid, -1600, -110, ease.in) : tw(t, mid, end, -110, 1300, ease.out);

  window.DURATION = 8;
  window.renderAt = (t) => {
    const scene = t < HOME_OUT ? "home" : t < STORY_IN ? "agenda" : t < GAL_IN ? "story" : t < HOME_BACK ? "gal" : "home";
    for (const id of ["home", "agenda", "story", "gal"]) $(id).style.opacity = id === scene ? 1 : 0;
    // The story fades in over the zoomed agenda.
    if (scene === "story") {
      $("story").style.opacity = seg(t, STORY_IN, STORY_IN + 0.2);
      $("agenda").style.opacity = t < STORY_IN + 0.2 ? 1 : 0;
    }

    // Home: gentle push-in, back to exactly scale 1 at the loop point.
    const hs = t < 4 ? tw(t, 0, HOME_OUT, 1, 1.035) : tw(t, HOME_BACK, 7.85, 1.035, 1, ease.out);
    $("homeImg").style.transform = `scale(${hs})`;

    // Agenda: real scroll to the concert stories, hover a card, click and zoom into it.
    agendaAt(t, AGENDA_SCROLL);
    $("agendaHover").style.opacity = seg(t, 3.15, 3.3);
    const az = tw(t, CLICK_CARD + 0.05, STORY_IN + 0.2, 1, 1.6, ease.in);
    $("agenda").style.transformOrigin = `${kx}px ${ky}px`;
    $("agenda").style.transform = `scale(${az})`;
    $("agenda").style.filter = `blur(${tw(t, 3.6, STORY_IN + 0.2, 0, 6)}px)`;

    // Story: lands slightly zoomed on the hero, then the real scroll into the article.
    storyAt(t, STORY_SCROLL);
    const sz = tw(t, STORY_IN, STORY_SCROLL, 1.06, 1, ease.out);
    $("story").style.transformOrigin = "640px 400px";
    $("story").style.transform = `scale(${sz})`;

    // Gallery: open the "Nos concerts" album (closed, then fully loaded), then a slow push-in.
    $("galOpen").style.opacity = seg(t, CLICK_ACC + 0.08, CLICK_ACC + 0.3);
    const gz = tw(t, CLICK_ACC + 0.3, HOME_BACK, 1, 1.04, ease.linear);
    $("gal").style.transformOrigin = "640px 520px";
    $("gal").style.transform = `scale(${gz})`;

    // Brand wipes: home -> agenda, story -> gallery, gallery -> home.
    const w = t < 3 ? wipeX(t, 1.0, HOME_OUT, 1.65) : t < 6.5 ? wipeX(t, 5.15, GAL_IN, 5.8) : wipeX(t, 6.85, HOME_BACK, 7.55);
    $("wipe").style.transform = `translateX(${w + 1500}px)`;
    // Keep the logo centred on the visible part of the panel (the panel spans [w, w + 1500]).
    const cx = (Math.max(0, w) + Math.min(1280, w + 1500)) / 2;
    $("logo").style.left = `${cx - w}px`;
    $("logo").style.opacity = w > -1400 && w < 1180 ? 1 : 0;

    cur1(t); cur2(t); cur3(t);
  };
</script>
</body>
</html>
