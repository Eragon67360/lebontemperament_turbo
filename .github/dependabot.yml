# Dependabot: version and security updates, all against dev (the integration
# branch; main only receives release PRs). Minor and patch bumps arrive as one
# grouped PR per ecosystem per week, and majors in a second grouped PR (triaged
# together; see #400 for the ones that need code changes or device tests).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-majors:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # Types follow the Node major the apps run on (engines.node 24.x).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The root TypeScript is the one ESLint's parser loads; typescript-eslint
      # doesn't support TypeScript 7 yet (the apps type-check with 7 already).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react 7.37.5 (the latest) supports ESLint up to 9 and
      # crashes on 10 (`context.getFilename` was removed). Lift both once it
      # supports 10 (#400).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pub
    directory: /apps/mobile_app
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      pub-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pub-majors:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: "chore(mobile)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-majors:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: "ci"
