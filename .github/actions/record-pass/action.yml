name: Record a passed CI job
description: >-
  Leaves a small marker artifact saying this CI job passed on this exact code
  (ci.yml's "Changed paths" job looks for it and skips the job when a later
  run checks the same code again, e.g. the release PR after the version bump).

inputs:
  job:
    description: The job's id in ci.yml (lint, ios, ...)
    required: true
  key:
    description: The hash of the code the job checked (from the "Changed paths" job)
    required: true

runs:
  using: composite
  steps:
    - name: Write the marker
      shell: bash
      run: echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/ci-passed.txt"
    - name: Upload the marker
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ci-passed-${{ inputs.job }}-${{ inputs.key }}
        path: ${{ runner.temp }}/ci-passed.txt
        retention-days: 14
        overwrite: true
        if-no-files-found: error
