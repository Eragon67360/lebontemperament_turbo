name: CI

# Checks on every pull request into dev or main (and on demand). Vercel's
# preview builds run separately; these are the gates docs/agents/quality-gates.md
# asks for: lint, types, domain tests, a build of each changed app, and the
# Flutter analyzer, tests and Android and iOS builds when the mobile app changed.
#
# A job that already passed on the exact same code is skipped instead of run
# twice: each job leaves a marker artifact keyed by the code it checked, and
# "Changed paths" looks for it. The release PR dev -> main checks the same
# tree as the version-bump PR merged just before it, so it usually reuses
# everything. Website, admin and the checks key on the whole tree; the
# mobile jobs on apps/mobile_app plus this file, so a PR that only touched
# the website doesn't make the app rebuild either.

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # The Next.js builds evaluate a few modules at build time that insist on these
  # variables existing (website: app/layout.tsx, Stripe routes, Cloudinary).
  # Obvious placeholders satisfy the existence checks; no real value is needed
  # to compile, and no network call succeeds.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  NEXT_PUBLIC_BASE_URL: https://www.example.com
  NEXT_PUBLIC_SITE_URL: https://www.example.com
  NEXT_PUBLIC_ADMIN_URL: https://admin.example.com
  NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci-placeholder
  GOOGLE_CLIENT_ID: ci-placeholder
  GOOGLE_CLIENT_SECRET: ci-placeholder
  STRIPE_SECRET_KEY: ci-placeholder

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files through the API
      actions: read # looks up the markers of earlier runs
    outputs:
      # On workflow_dispatch there is no base to diff against: run everything.
      website: ${{ github.event_name != 'pull_request' || steps.filter.outputs.website == 'true' }}
      admin: ${{ github.event_name != 'pull_request' || steps.filter.outputs.admin == 'true' }}
      mobile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.mobile == 'true' }}
      # The code each job checks, and the jobs that already passed on it.
      tree: ${{ steps.keys.outputs.tree }}
      mobile_key: ${{ steps.keys.outputs.mobile }}
      passed: ${{ steps.reuse.outputs.passed || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # On a pull request this is GitHub's test merge with the base: the code
      # that lands if the PR is merged now.
      - name: Hash the code
        id: keys
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "mobile=$(git rev-parse HEAD:apps/mobile_app HEAD:.github/workflows/ci.yml | sha1sum | cut -c1-40)" >> "$GITHUB_OUTPUT"
      - name: Look for jobs that already passed on this code
        id: reuse
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TREE: ${{ steps.keys.outputs.tree }}
          MOBILE: ${{ steps.keys.outputs.mobile }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const repoId = context.payload.repository.id;
            const { TREE, MOBILE } = process.env;
            const keys = {
              lint: TREE, types: TREE, 'domain-tests': TREE,
              'build-website': TREE, 'build-admin': TREE,
              flutter: MOBILE, android: MOBILE, ios: MOBILE,
            };
            const passed = [];
            for (const [job, key] of Object.entries(keys)) {
              try {
                const { data } = await github.rest.actions.listArtifactsForRepo({
                  owner, repo, name: `ci-passed-${job}-${key}`, per_page: 10,
                });
                // Only this repository's own runs count: a fork's PR can
                // upload an artifact with any name.
                const hit = data.artifacts.find(
                  (a) => !a.expired && a.workflow_run?.head_repository_id === repoId,
                );
                if (hit) {
                  passed.push(job);
                  core.notice(`${job} already passed on this exact code in ${context.serverUrl}/${owner}/${repo}/actions/runs/${hit.workflow_run.id}: skipped.`);
                }
              } catch (error) {
                // Can't tell: run the job.
                core.warning(`Could not look up ${job}: ${error.message}`);
              }
            }
            core.setOutput('passed', JSON.stringify(passed));
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            shared: &shared
              - package.json
              - package-lock.json
              - turbo.json
              - packages/**
              - .github/workflows/ci.yml
            website:
              - *shared
              - apps/website/**
            admin:
              - *shared
              - apps/admin/**
            mobile:
              - apps/mobile_app/**
              - .github/workflows/ci.yml

  lint:
    name: Lint
    needs: changes
    # Still runs if "Changed paths" itself failed.
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.passed || '[]'), 'lint') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # env/ templates: syntax, vault rules, drift against the code (no secrets needed).
      - run: npm run env:check
      - run: npm run test:env
      - name: Record the pass
        if: needs.changes.outputs.tree != ''
        uses: ./.github/actions/record-pass
        with:
          job: lint
          key: ${{ needs.changes.outputs.tree }}

  types:
    name: Types
    needs: changes
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.passed || '[]'), 'types') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check-types
      - name: Record the pass
        if: needs.changes.outputs.tree != ''
        uses: ./.github/actions/record-pass
        with:
          job: types
          key: ${{ needs.changes.outputs.tree }}

  domain-tests:
    name: Domain tests
    needs: changes
    if: ${{ !cancelled() && !contains(fromJSON(needs.changes.outputs.passed || '[]'), 'domain-tests') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w @repo/domain
      - name: Record the pass
        if: needs.changes.outputs.tree != ''
        uses: ./.github/actions/record-pass
        with:
          job: domain-tests
          key: ${{ needs.changes.outputs.tree }}

  build-website:
    name: Build website
    needs: changes
    if: needs.changes.outputs.website == 'true' && !contains(fromJSON(needs.changes.outputs.passed || '[]'), 'build-website')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/website/.next/cache
          key: next-website-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/website/**/*.ts', 'apps/website/**/*.tsx', 'apps/website/**/*.js', 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: |
            next-website-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npx turbo build --filter=website
      - name: Record the pass
        if: needs.changes.outputs.tree != ''
        uses: ./.github/actions/record-pass
        with:
          job: build-website
          key: ${{ needs.changes.outputs.tree }}

  build-admin:
    name: Build admin
    needs: changes
    if: needs.changes.outputs.admin == 'true' && !contains(fromJSON(needs.changes.outputs.passed || '[]'), 'build-admin')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/admin/.next/cache
          key: next-admin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/admin/**/*.ts', 'apps/admin/**/*.tsx', 'apps/admin/**/*.js', 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: |
            next-admin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npx turbo build --filter=admin
      - name: Record the pass
        if: needs.changes.outputs.tree != ''
        uses: ./.github/actions/record-pass
        with:
          job: build-admin
          key: ${{ needs.changes.outputs.tree }}

  flutter:
    name: Flutter
    needs: changes
    if: needs.changes.outputs.mobile == 'true' && !contains(fromJSON(needs.changes.outputs.passed || '[]'), 'flutter')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # pubspec.yaml requires Flutter >=3.47 (#400); keep in
          # step with android-build-release.yml.
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      # pubspec.yaml declares .env as an asset; the analyzer and tests only need
      # the file to exist.
      - run: cp .env.example .env
      - run: flutter pub get
      # Errors fail the job; the remaining infos and warnings (34 on Flutter 3.47)
      # do not.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Record the pass
        if: needs.changes.outputs.mobile_key != ''
        uses: ./.github/actions/record-pass
        with:
          job: flutter
          key: ${{ needs.changes.outputs.mobile_key }}

  android:
    name: Android build
    needs: changes
    if: needs.changes.outputs.mobile == 'true' && !contains(fromJSON(needs.changes.outputs.passed || '[]'), 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' }}
      - run: cp .env.example .env
      - run: flutter pub get
      # Compiles the Android project (Gradle, manifests, R8 with the release
      # rules) before a merge instead of on main. No key.properties here, so
      # the APK is signed with the debug key and never leaves the runner.
      - run: flutter build apk --release
      # The Play Store lanes install and load (no key here, nothing is sent).
      - name: Install fastlane
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile_app/android
      - name: fastlane lanes
        working-directory: apps/mobile_app/android
        env:
          LC_ALL: C.UTF-8
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "1"
        run: bundle exec fastlane lanes
      - name: Record the pass
        if: needs.changes.outputs.mobile_key != ''
        uses: ./.github/actions/record-pass
        with:
          job: android
          key: ${{ needs.changes.outputs.mobile_key }}

  ios:
    name: iOS build
    needs: changes
    if: needs.changes.outputs.mobile == 'true' && !contains(fromJSON(needs.changes.outputs.passed || '[]'), 'ios')
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: cp .env.example .env
      - run: flutter pub get
      # Installs the pods and compiles the iOS project with the same Xcode as
      # the TestFlight workflow, without signing (nothing leaves the runner).
      - run: flutter build ios --release --no-codesign
      - name: Record the pass
        if: needs.changes.outputs.mobile_key != ''
        uses: ./.github/actions/record-pass
        with:
          job: ios
          key: ${{ needs.changes.outputs.mobile_key }}
