name: E2E Daily (staging)

on:
  schedule:
    # ~07:30 Europe/Paris (CEST). GitHub cron is UTC-only and may drift 5-30min.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      project:
        description: Which project to run
        type: choice
        options: [all, website, admin]
        default: all

# Never cancel mid-run against live staging (could leave cleanup half-done).
concurrency:
  group: e2e-daily
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2] # bump total when the suite grows past ~60 tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E tests (shard ${{ matrix.shard }}/2)
        working-directory: apps/e2e
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Phase 4+ only (global-teardown sweeper):
          # SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          npx playwright test --shard=${{ matrix.shard }}/2
          ${{ inputs.project && inputs.project != 'all' && format('--project={0}', inputs.project) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/e2e/blob-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: apps/e2e/test-results/
          retention-days: 14

  merge-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blobs
          merge-multiple: true
      - run: npx playwright merge-reports --reporter=html ./all-blobs
        working-directory: apps/e2e
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
      - name: Open or update failure issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'e2e-failure',
            });
            const body = `E2E daily run failed: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (issues.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `E2E daily failure – ${new Date().toISOString().slice(0, 10)}`,
                body,
                labels: ['e2e-failure'],
              });
            }
      - name: Close failure issue when green
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'e2e-failure',
            });
            for (const i of issues) {
              await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: 'Green again, closing.' });
              await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
            }
