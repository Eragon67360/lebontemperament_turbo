name: E2E Daily (staging)

on:
  schedule:
    # ~07:30 Europe/Paris (CEST). GitHub cron is UTC-only and may drift 5-30min.
    - cron: "30 5 * * *"
  # Staging deploys from dev — re-test once Vercel reports the deployments ready.
  deployment_status:
  workflow_dispatch:
    inputs:
      project:
        description: Which project to run
        type: choice
        options: [all, website, admin]
        default: all

# Deployment-triggered runs are per-commit and cancel superseded gate-waiters;
# scheduled/dispatch runs share one group and are never cancelled mid-run
# (could leave cleanup half-done against live staging).
concurrency:
  group: ${{ github.event_name == 'deployment_status' && format('e2e-deploy-{0}', github.event.deployment.sha) || 'e2e-daily' }}
  cancel-in-progress: ${{ github.event_name == 'deployment_status' }}

permissions:
  contents: read
  issues: write
  deployments: read

jobs:
  # Decides whether this event is worth a run. Vercel fires deployment_status
  # for every PR preview too (environment "Preview – <project>", ref = commit
  # SHA), so only a successful Preview deployment of the dev branch head
  # passes. Everything else is skipped at job level: no red checks on PRs.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run: ${{ steps.decide.outputs.run }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - name: Decide whether to run
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            if (context.eventName !== 'deployment_status') {
              core.setOutput('run', 'true');
              core.setOutput('ref', 'dev');
              return;
            }
            const status = context.payload.deployment_status;
            const deployment = context.payload.deployment;
            const sha = deployment.sha;
            const environment = deployment.environment ?? '';
            if (status.state !== 'success' || !environment.startsWith('Preview')) {
              core.notice(`Ignoring ${environment} deployment ${sha.slice(0, 7)} (${status.state}).`);
              core.setOutput('run', 'false');
              return;
            }
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'dev' });
            if (branch.commit.sha !== sha) {
              core.notice(`Deployment ${sha.slice(0, 7)} is not the dev head (${branch.commit.sha.slice(0, 7)}): a PR preview or a stale deploy, skipping.`);
              core.setOutput('run', 'false');
              return;
            }
            core.setOutput('run', 'true');
            core.setOutput('ref', sha);
      - name: Wait for all Vercel deployments of this commit
        if: steps.decide.outputs.run == 'true' && github.event_name == 'deployment_status'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.payload.deployment.sha;
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({ owner, repo, sha });
              const states = [];
              for (const d of deployments) {
                const { data: s } = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: d.id, per_page: 1,
                });
                states.push(`${d.environment}:${s[0]?.state ?? 'unknown'}`);
              }
              core.info(`deployments for ${sha.slice(0, 7)}: ${states.join(', ')}`);
              // Vercel registers both projects' deployments within seconds of
              // the push, long before the first success event — so "all
              // current deployments succeeded" implies both apps.
              if (states.length > 0 && states.every((s) => s.endsWith(':success'))) return;
              if (states.some((s) => s.endsWith(':failure') || s.endsWith(':error'))) {
                core.setFailed('A Vercel deployment failed for this commit.');
                return;
              }
              await new Promise((r) => setTimeout(r, 20000));
            }
            core.setFailed('Timed out waiting for Vercel deployments.');

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2] # bump total when the suite grows past ~60 tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled and manual runs test the dev branch (what staging serves);
          # deployment runs test the exact commit Vercel deployed.
          ref: ${{ needs.gate.outputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E tests (shard ${{ matrix.shard }}/2)
        working-directory: apps/e2e
        # Read-only run: E2E_ALLOW_WRITES is deliberately not set, so
        # concerts-write.spec.ts is skipped and global-teardown sweeps nothing
        # (staging shares the production database, see #363). The job
        # therefore needs no Supabase key.
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: >-
          npx playwright test --shard=${{ matrix.shard }}/2
          ${{ inputs.project && inputs.project != 'all' && format('--project={0}', inputs.project) || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/e2e/blob-report/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: apps/e2e/test-results/
          retention-days: 14

  merge-report:
    needs: [gate, test]
    # Runs only when the tests actually ran (not when the gate skipped them or
    # a superseding deployment cancelled them).
    if: always() && contains(fromJSON('["success", "failure"]'), needs.test.result)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          path: apps/e2e/all-blobs
          merge-multiple: true
      - run: npx playwright merge-reports --reporter=html ./all-blobs
        working-directory: apps/e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
      # The issue steps read the test job's result, not this job's: a step-level
      # failure() here only sees the merge steps above, so it never fired.
      - name: Open or update failure issue
        if: always() && needs.test.result == 'failure' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'e2e-failure',
            });
            const body = `E2E run failed (${context.eventName}): ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (issues.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `E2E daily failure – ${new Date().toISOString().slice(0, 10)}`,
                body,
                labels: ['e2e-failure'],
              });
            }
      - name: Close failure issue when green
        if: always() && needs.test.result == 'success' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'e2e-failure',
            });
            for (const i of issues) {
              await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: 'Green again, closing.' });
              await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
            }
