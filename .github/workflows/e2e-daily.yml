name: E2E Daily (staging)

on:
  schedule:
    # ~07:30 Europe/Paris (CEST). GitHub cron is UTC-only and may drift 5-30min.
    - cron: "30 5 * * *"
  # Daily only (owner's choice, 2026-10-09): PRs get ci.yml; before a
  # release, start this workflow by hand on the dev head.
  workflow_dispatch:
    inputs:
      project:
        description: Which project to run
        type: choice
        options: [all, website, admin]
        default: all
      admin_url:
        description: >-
          Optional: run the admin specs against this PR preview instead of
          staging (https://lebontemperament-admin-<hash>-le-bon-temperament.vercel.app).
          Needs ref. Nothing is uploaded: logged-in pages show real members.
        type: string
        default: ""
      ref:
        description: Branch or commit whose specs run against admin_url (the PR head)
        type: string
        default: ""

# One run at a time, never cancelled mid-run (could leave cleanup half-done
# against live staging).
concurrency:
  group: e2e-daily
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # Picks the target: staging and the dev branch, or an admin PR preview with
  # its head when dispatched with admin_url.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      ref: ${{ steps.decide.outputs.ref }}
      admin_url: ${{ steps.decide.outputs.admin_url }}
      preview: ${{ steps.decide.outputs.preview }}
    steps:
      - name: Decide whether to run
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ADMIN_URL_INPUT: ${{ inputs.admin_url }}
          REF_INPUT: ${{ inputs.ref }}
        with:
          script: |
            core.setOutput('preview', 'false');
            const adminUrl = (process.env.ADMIN_URL_INPUT ?? '').trim();
            if (context.eventName === 'workflow_dispatch' && adminUrl) {
              // The e2e account's credentials go to this host: only this
              // team's admin previews are accepted.
              if (!/^https:\/\/lebontemperament-admin-[a-z0-9]+-le-bon-temperament\.vercel\.app$/.test(adminUrl)) {
                core.setFailed(`admin_url must be an admin preview of the le-bon-temperament team, got ${adminUrl}.`);
                return;
              }
              const ref = (process.env.REF_INPUT ?? '').trim();
              if (!/^[A-Za-z0-9._\/-]+$/.test(ref)) {
                core.setFailed('ref (the PR head branch or commit) is required with admin_url.');
                return;
              }
              core.setOutput('run', 'true');
              core.setOutput('ref', ref);
              core.setOutput('admin_url', adminUrl);
              core.setOutput('preview', 'true');
              return;
            }
            core.setOutput('run', 'true');
            core.setOutput('ref', 'dev');

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2] # bump total when the suite grows past ~60 tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled and manual runs test the dev branch (what staging serves).
          ref: ${{ needs.gate.outputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E tests (shard ${{ matrix.shard }}/2)
        working-directory: apps/e2e
        # Every target here (dev, admin-dev, admin previews) uses the staging
        # database since #363, so concerts-write.spec.ts may create and delete
        # its E2E_ concert there. global-teardown's orphan sweep is skipped:
        # the job has no Supabase key.
        env:
          E2E_ALLOW_WRITES: "1"
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Empty unless this is a preview run (the config falls back to staging).
          ADMIN_URL: ${{ needs.gate.outputs.admin_url }}
        run: >-
          npx playwright test --shard=${{ matrix.shard }}/2
          ${{ needs.gate.outputs.preview == 'true' && '--project=admin' || (inputs.project && inputs.project != 'all' && format('--project={0}', inputs.project)) || '' }}
      # Preview runs upload nothing: reports, traces and screenshots of
      # logged-in pages show real members, and artifacts of a public repo are
      # downloadable by anyone signed in to GitHub.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.gate.outputs.preview != 'true'
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/e2e/blob-report/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && needs.gate.outputs.preview != 'true'
        with:
          name: test-results-${{ matrix.shard }}
          path: apps/e2e/test-results/
          retention-days: 14

  merge-report:
    needs: [gate, test]
    # Runs only when the tests actually ran (not when the gate skipped them or
    # a cancelled run stopped them).
    if: always() && needs.gate.outputs.preview != 'true' && contains(fromJSON('["success", "failure"]'), needs.test.result)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          path: apps/e2e/all-blobs
          merge-multiple: true
      - run: npx playwright merge-reports --reporter=html ./all-blobs
        working-directory: apps/e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
      # The issue steps read the test job's result, not this job's: a step-level
      # failure() here only sees the merge steps above, so it never fired.
      - name: Open or update failure issue
        if: always() && needs.test.result == 'failure' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'e2e-failure',
            });
            const body = `E2E run failed (${context.eventName}): ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (issues.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `E2E daily failure – ${new Date().toISOString().slice(0, 10)}`,
                body,
                labels: ['e2e-failure'],
              });
            }
      - name: Close failure issue when green
        if: always() && needs.test.result == 'success' && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'e2e-failure',
            });
            for (const i of issues) {
              await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: 'Green again, closing.' });
              await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
            }
