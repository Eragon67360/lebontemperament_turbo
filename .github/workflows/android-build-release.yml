# Android APK build and GitHub Release
# - Push to dev: bump build number, build APK, create draft release
# - Push to main: bump app version (patch) + build number, build APK, create full release
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY
#   SITE_URL_DEV (e.g. https://dev.lebontemperament.com) — used for dev
#   SITE_URL_PROD (e.g. https://www.lebontemperament.com) — used for main

name: Android Build and Release

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: write

jobs:
  build_and_release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    # Set the job name dynamically based on the branch
    name: Android (${{ github.ref_name == 'main' && 'Main' || 'Dev' }})
    runs-on: ubuntu-latest

    # Set all branch-specific parameters here using conditional expressions.
    # This is evaluated after the trigger but before the steps run, so contexts are available.
    env:
      BUMP_TYPE: ${{ github.ref_name == 'main' && 'patch' || 'build' }}
      DRAFT_RELEASE: ${{ github.ref_name == 'main' && 'false' || 'true' }}
      SITE_URL: ${{ github.ref_name == 'main' && secrets.SITE_URL_PROD || secrets.SITE_URL_DEV }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Bump version
        id: bump
        run: |
          # Use the BUMP_TYPE environment variable defined at the job level
          NEW_VERSION=$(node scripts/bump-mobile-version.js ${{ env.BUMP_TYPE }} | tail -1)
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Calculated version: $NEW_VERSION"

      - name: Commit version bump
        # The condition now uses the reliable github.ref_name context
        if: github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mobile_app/pubspec.yaml
          git diff --staged --quiet || git commit -m "chore(mobile): bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push || true

      - name: Provide .env for build
        working-directory: apps/mobile_app
        # Secrets are passed in via env vars at the job level now for simplicity
        env:
          # These secrets are constant for both branches
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "" >> .env
          echo "# Public website URL (for driver tracking share link)" >> .env
          # The SITE_URL is inherited from the job-level env
          echo "SITE_URL=$SITE_URL" >> .env

      - name: Install dependencies
        working-directory: apps/mobile_app
        run: flutter pub get

      - name: Build APK
        working-directory: apps/mobile_app
        run: flutter build apk --release

      - name: Rename APK for release
        id: rename
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          OLD_PATH="apps/mobile_app/build/app/outputs/flutter-apk/app-release.apk"
          NEW_PATH="apps/mobile_app/build/app/outputs/flutter-apk/BT-App-v${VERSION}.apk"
          mv $OLD_PATH $NEW_PATH
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT
          echo "Renamed APK to $NEW_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android/v${{ steps.bump.outputs.version }}"
          name: "Android v${{ steps.bump.outputs.version }}"
          # Use the DRAFT_RELEASE environment variable
          draft: ${{ env.DRAFT_RELEASE }}
          prerelease: false
          files: ${{ steps.rename.outputs.apk_path }}
          generate_release_notes: true
