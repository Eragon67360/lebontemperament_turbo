# Android APK build and GitHub Release (turborepo: mobile app lives in apps/mobile_app)
# - Push to dev / development / release/*: bump build number, build APK, create draft release
# - Push to main: bump app version (patch) + build number, build APK, create full release

name: Android Build and Release

on:
  push:
    branches:
      - dev
      - development
      - "release/**"
      - main

permissions:
  contents: write

jobs:
  android-dev:
    name: Android (dev / release branch)
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/heads/release/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Bump build version
        id: bump
        run: |
          NEW_VERSION=$(node scripts/bump-mobile-version.js build | tail -1)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped to $NEW_VERSION"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mobile_app/pubspec.yaml
          git diff --staged --quiet || git commit -m "chore(mobile): bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push || true

      - name: Install dependencies
        working-directory: apps/mobile_app
        run: flutter pub get

      - name: Build APK
        working-directory: apps/mobile_app
        run: flutter build apk --release

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android/${{ steps.bump.outputs.new_version }}"
          name: "Android ${{ steps.bump.outputs.new_version }}"
          draft: true
          prerelease: false
          files: apps/mobile_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

  android-main:
    name: Android (main)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Bump app version (patch + build)
        id: bump
        run: |
          NEW_VERSION=$(node scripts/bump-mobile-version.js patch | tail -1)
          VERSION_NAME=$(echo "$NEW_VERSION" | sed 's/+.*//')
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Bumped to $NEW_VERSION (release $VERSION_NAME)"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mobile_app/pubspec.yaml
          git diff --staged --quiet || git commit -m "chore(mobile): release ${{ steps.bump.outputs.version_name }} [skip ci]"
          git push || true

      - name: Install dependencies
        working-directory: apps/mobile_app
        run: flutter pub get

      - name: Build APK
        working-directory: apps/mobile_app
        run: flutter build apk --release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump.outputs.version_name }}"
          name: "v${{ steps.bump.outputs.version_name }}"
          draft: false
          prerelease: false
          files: apps/mobile_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
