name: Android Build and Release

on:
  push:
    branches:
      - dev
      - main
    # BEST PRACTICE: Only run when mobile app code is changed
    paths:
      - "apps/mobile_app/**"
      - ".github/workflows/android-build-release.yml"
      - "scripts/bump-mobile-version.js"

permissions:
  contents: write

jobs:
  build_and_release:
    # THE FIX: Prevent workflow recursion from the version bump commit
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    name: Android (${{ github.ref_name == 'main' && 'Main' || 'Dev' }})
    runs-on: ubuntu-latest

    env:
      BUMP_TYPE: ${{ github.ref_name == 'main' && 'patch' || 'build' }}
      DRAFT_RELEASE: ${{ github.ref_name == 'main' && 'false' || 'true' }}
      SITE_URL: ${{ github.ref_name == 'main' && secrets.SITE_URL_PROD || secrets.SITE_URL_DEV }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # You need to fetch the full history for the bump script to work correctly
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(node scripts/bump-mobile-version.js ${{ env.BUMP_TYPE }} | tail -1)
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Calculated version: $NEW_VERSION"

      - name: Commit version bump
        if: github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile_app/pubspec.yaml
          git diff --staged --quiet || git commit -m "chore(mobile): bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

      - name: Provide .env for build
        working-directory: apps/mobile_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "" >> .env
          echo "# Public website URL (for driver tracking share link)" >> .env
          echo "SITE_URL=$SITE_URL" >> .env

      - name: Install dependencies
        working-directory: apps/mobile_app
        run: flutter pub get

      - name: Build APK
        working-directory: apps/mobile_app
        run: flutter build apk --release

      - name: Rename APK for release
        id: rename
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          OLD_PATH="apps/mobile_app/build/app/outputs/flutter-apk/app-release.apk"
          NEW_PATH="apps/mobile_app/build/app/outputs/flutter-apk/BT-App-v${VERSION}.apk"
          mv $OLD_PATH $NEW_PATH
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT
          echo "Renamed APK to $NEW_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android/v${{ steps.bump.outputs.version }}"
          name: "Android v${{ steps.bump.outputs.version }}"
          draft: ${{ env.DRAFT_RELEASE }}
          prerelease: false
          files: ${{ steps.rename.outputs.apk_path }}
          generate_release_notes: true
