# Android APK build and GitHub Release
# - Push to dev: bump build number, build APK, create draft release
# - Push to main: bump app version (patch) + build number, build APK, create full release
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY
#   SITE_URL_DEV (e.g. https://dev.lebontemperament.com) — used for dev
#   SITE_URL_PROD (e.g. https://www.lebontemperament.com) — used for main

name: Android Build and Release

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: write

jobs:
  build_and_release:
    name: Android (${{ matrix.name }})
    runs-on: ubuntu-latest

    # Set job-level environment variables. This is where we can safely access secrets.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Conditionally set SITE_URL based on the branch from the matrix
      SITE_URL: ${{ github.ref_name == 'dev' && secrets.SITE_URL_DEV || secrets.SITE_URL_PROD }}

    strategy:
      matrix:
        include:
          - name: "Dev"
            branch: "dev"
            bump_type: "build"
            draft_release: true
          - name: "Main"
            branch: "main"
            bump_type: "patch"
            draft_release: false

    # Run this job only if the push is to a branch defined in the matrix
    if: github.ref == format('refs/heads/{0}', matrix.branch)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(node scripts/bump-mobile-version.js ${{ matrix.bump_type }} | tail -1)
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Calculated version: $NEW_VERSION"

      - name: Commit version bump
        if: matrix.branch == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/mobile_app/pubspec.yaml
          git diff --staged --quiet || git commit -m "chore(mobile): bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push || true

      - name: Provide .env for build
        working-directory: apps/mobile_app
        # This step now inherits all the necessary env vars from the job level
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "" >> .env
          echo "# Public website URL (for driver tracking share link)" >> .env
          echo "SITE_URL=$SITE_URL" >> .env

      - name: Install dependencies
        working-directory: apps/mobile_app
        run: flutter pub get

      - name: Build APK
        working-directory: apps/mobile_app
        run: flutter build apk --release

      - name: Rename APK for release
        id: rename
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          OLD_PATH="apps/mobile_app/build/app/outputs/flutter-apk/app-release.apk"
          NEW_PATH="apps/mobile_app/build/app/outputs/flutter-apk/BT-App-v${VERSION}.apk"
          mv $OLD_PATH $NEW_PATH
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT
          echo "Renamed APK to $NEW_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android/v${{ steps.bump.outputs.version }}"
          name: "Android v${{ steps.bump.outputs.version }}"
          draft: ${{ matrix.draft_release }}
          prerelease: false
          files: ${{ steps.rename.outputs.apk_path }}
          generate_release_notes: true
