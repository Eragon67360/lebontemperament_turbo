name: Android Build and Release

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile_app/**"
      - "!apps/mobile_app/pubspec.yaml"
      - ".github/workflows/android-build-release.yml"

# Least privilege: only the release job may write to the repository (it
# creates the GitHub release). The build job reads.
permissions:
  contents: read

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    env:
      # The production website, public and fixed: the app's Partitions,
      # support form and tracking links call it. Not a secret, so a stale or
      # staging value (behind Vercel Authentication) can't slip into a store
      # build.
      SITE_URL: https://www.lebontemperament.com

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version
        id: version
        run: |
          VERSION=$(node -e "const v=require('./version.json'); console.log(v.version+'+'+v.build)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pinned (same as ci.yml) so releases are reproducible; pubspec.lock
          # requires Flutter >=3.47 (#400).
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true # Optimization: Cache Flutter Engine

      # Optimization: Cache Gradle dependencies to speed up build
      - name: Gradle Cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Create .env and Keystore
        working-directory: apps/mobile_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DRIVE_FOLDER_ADULTES: ${{ secrets.DRIVE_FOLDER_ADULTES }}
          DRIVE_FOLDER_JEUNES: ${{ secrets.DRIVE_FOLDER_JEUNES }}
          DRIVE_FOLDER_ENFANTS: ${{ secrets.DRIVE_FOLDER_ENFANTS }}
          DRIVE_FOLDER_ORCHESTRE: ${{ secrets.DRIVE_FOLDER_ORCHESTRE }}
          DRIVE_FOLDER_CAHIER_30_ANS: ${{ secrets.DRIVE_FOLDER_CAHIER_30_ANS }}
          DRIVE_FOLDER_MAIN: ${{ secrets.DRIVE_FOLDER_MAIN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "SITE_URL=$SITE_URL" >> .env
          [ -n "$DRIVE_FOLDER_ADULTES" ] && echo "DRIVE_FOLDER_ADULTES=$DRIVE_FOLDER_ADULTES" >> .env
          [ -n "$DRIVE_FOLDER_JEUNES" ] && echo "DRIVE_FOLDER_JEUNES=$DRIVE_FOLDER_JEUNES" >> .env
          [ -n "$DRIVE_FOLDER_ENFANTS" ] && echo "DRIVE_FOLDER_ENFANTS=$DRIVE_FOLDER_ENFANTS" >> .env
          [ -n "$DRIVE_FOLDER_ORCHESTRE" ] && echo "DRIVE_FOLDER_ORCHESTRE=$DRIVE_FOLDER_ORCHESTRE" >> .env
          [ -n "$DRIVE_FOLDER_CAHIER_30_ANS" ] && echo "DRIVE_FOLDER_CAHIER_30_ANS=$DRIVE_FOLDER_CAHIER_30_ANS" >> .env
          [ -n "$DRIVE_FOLDER_MAIN" ] && echo "DRIVE_FOLDER_MAIN=$DRIVE_FOLDER_MAIN" >> .env

          cd android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" > key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> key.properties
          echo "storeFile=upload-keystore.jks" >> key.properties

      - name: Install dependencies
        working-directory: apps/mobile_app
        run: flutter pub get

      # --- STEP 0: Analyze and test before spending minutes on a build ---
      - name: Analyze
        working-directory: apps/mobile_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings # errors only; #362 tracks the warnings

      - name: Test
        working-directory: apps/mobile_app
        run: flutter test

      # --- STEP 1: Build the AAB (The "Source of Truth") ---
      - name: Build App Bundle
        working-directory: apps/mobile_app
        run: flutter build appbundle --release

      # Release notes: the « Nouveautés » text written on the release PR in
      # fastlane/metadata (one file per store language), in the layout the
      # upload action expects (whatsnew-<locale>).
      - name: Prepare release notes
        working-directory: apps/mobile_app/android/fastlane/metadata/android
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          for notes in */changelogs/default.txt; do
            locale="${notes%%/*}"
            cp "$notes" "$RUNNER_TEMP/whatsnew/whatsnew-$locale"
          done
          ls "$RUNNER_TEMP/whatsnew"

      # --- STEP 2: Upload to Google Play IMMEDIATELY ---
      # We do this BEFORE generating the APK. If this fails, the pipeline stops.
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          packageName: com.lebontemperament.app
          # Use the standard Flutter build path since we haven't renamed it yet
          releaseFiles: apps/mobile_app/build/app/outputs/bundle/release/app-release.aab
          mappingFile: apps/mobile_app/build/app/outputs/mapping/release/mapping.txt
          track: internal
          # Released to internal testers (not a draft): Google refuses to promote
          # a draft, so the Play Store workflow's `promote` task needs this.
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      # --- STEP 3: Generate APK from AAB (Optimization) ---
      # We skip 'flutter build apk' to save time, and instead convert the AAB.
      - name: Generate APK from AAB
        working-directory: apps/mobile_app
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # SHA-256 of bundletool-all-1.15.6.jar from the GitHub release
          # (google/bundletool publishes no digest; computed once from the
          # release asset, 29 105 379 bytes). Update it with the version.
          BUNDLETOOL_VERSION: 1.15.6
          BUNDLETOOL_SHA256: 38ae8a10bcdacef07ecce8211188c5c92b376be96da38ff3ee1f2cf4895b2cb8
        run: |
          # 1. Download Bundletool and verify it before running it
          wget -q "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" -O bundletool.jar
          echo "${BUNDLETOOL_SHA256}  bundletool.jar" | sha256sum -c -

          # 2. FIX: Create the output directory explicitly (Flutter doesn't create it for AAB builds)
          mkdir -p build/app/outputs/flutter-apk

          # 3. Convert AAB to APKS (Universal Mode)
          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=app.apks \
            --mode=universal \
            --ks=android/upload-keystore.jks \
            --ks-pass=pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass=pass:"$ANDROID_KEY_PASSWORD"

          # 4. Extract the single APK
          unzip -p app.apks universal.apk > build/app/outputs/flutter-apk/app-release.apk

      # --- STEP 4: Rename and hand over to the release job ---
      - name: Rename Artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release-artifacts
          mv apps/mobile_app/build/app/outputs/bundle/release/app-release.aab "release-artifacts/BT-App-v${VERSION}.aab"
          mv apps/mobile_app/build/app/outputs/flutter-apk/app-release.apk "release-artifacts/BT-App-v${VERSION}.apk"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release
          path: release-artifacts/
          retention-days: 7
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: "android/v${{ needs.build.outputs.version }}"
          name: "Android v${{ needs.build.outputs.version }}"
          files: |
            release-artifacts/BT-App-v${{ needs.build.outputs.version }}.aab
            release-artifacts/BT-App-v${{ needs.build.outputs.version }}.apk
          generate_release_notes: true
