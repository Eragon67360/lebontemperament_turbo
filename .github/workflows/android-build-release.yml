name: Android Build and Release

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "apps/mobile_app/**"
      - "version.json"
      - ".github/workflows/android-build-release.yml"
      - "scripts/bump-version.js"

permissions:
  contents: write

jobs:
  build_and_release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    name: Android (${{ github.ref_name == 'main' && 'Main' || 'Dev' }})
    runs-on: ubuntu-latest

    env:
      DRAFT_RELEASE: ${{ github.ref_name == 'main' && 'false' || 'true' }}
      SITE_URL: ${{ github.ref_name == 'main' && secrets.SITE_URL_PROD || secrets.SITE_URL_DEV }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -e "const v=require('./version.json'); console.log(v.version+'+'+v.build)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Provide .env for build
        working-directory: apps/mobile_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "" >> .env
          echo "# Public website URL (for driver tracking share link)" >> .env
          echo "SITE_URL=$SITE_URL" >> .env

      - name: Install dependencies
        working-directory: apps/mobile_app
        run: flutter pub get

      - name: Build APK
        working-directory: apps/mobile_app
        run: flutter build apk --release

      - name: Rename APK for release
        id: rename
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          OLD_PATH="apps/mobile_app/build/app/outputs/flutter-apk/app-release.apk"
          NEW_PATH="apps/mobile_app/build/app/outputs/flutter-apk/BT-App-v${VERSION}.apk"
          mv $OLD_PATH $NEW_PATH
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT
          echo "Renamed APK to $NEW_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android/v${{ steps.version.outputs.version }}"
          name: "Android v${{ steps.version.outputs.version }}"
          draft: ${{ env.DRAFT_RELEASE }}
          prerelease: false
          files: ${{ steps.rename.outputs.apk_path }}
          generate_release_notes: true
