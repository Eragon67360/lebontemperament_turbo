name: Android Build and Release

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile_app/**"
      - "!apps/mobile_app/pubspec.yaml"
      - ".github/workflows/android-build-release.yml"

permissions:
  contents: write

jobs:
  build_and_release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: Android Release
    runs-on: ubuntu-latest

    env:
      SITE_URL: ${{ secrets.SITE_URL_PROD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -e "const v=require('./version.json'); console.log(v.version+'+'+v.build)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true # Optimization: Cache Flutter Engine

      # Optimization: Cache Gradle dependencies to speed up build
      - name: Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Create .env and Keystore
        working-directory: apps/mobile_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SITE_URL: ${{ secrets.SITE_URL_PROD }}
          DRIVE_FOLDER_ADULTES: ${{ secrets.DRIVE_FOLDER_ADULTES }}
          DRIVE_FOLDER_JEUNES: ${{ secrets.DRIVE_FOLDER_JEUNES }}
          DRIVE_FOLDER_ENFANTS: ${{ secrets.DRIVE_FOLDER_ENFANTS }}
          DRIVE_FOLDER_ORCHESTRE: ${{ secrets.DRIVE_FOLDER_ORCHESTRE }}
          DRIVE_FOLDER_CAHIER_30_ANS: ${{ secrets.DRIVE_FOLDER_CAHIER_30_ANS }}
          DRIVE_FOLDER_MAIN: ${{ secrets.DRIVE_FOLDER_MAIN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "SITE_URL=$SITE_URL" >> .env
          [ -n "$DRIVE_FOLDER_ADULTES" ] && echo "DRIVE_FOLDER_ADULTES=$DRIVE_FOLDER_ADULTES" >> .env
          [ -n "$DRIVE_FOLDER_JEUNES" ] && echo "DRIVE_FOLDER_JEUNES=$DRIVE_FOLDER_JEUNES" >> .env
          [ -n "$DRIVE_FOLDER_ENFANTS" ] && echo "DRIVE_FOLDER_ENFANTS=$DRIVE_FOLDER_ENFANTS" >> .env
          [ -n "$DRIVE_FOLDER_ORCHESTRE" ] && echo "DRIVE_FOLDER_ORCHESTRE=$DRIVE_FOLDER_ORCHESTRE" >> .env
          [ -n "$DRIVE_FOLDER_CAHIER_30_ANS" ] && echo "DRIVE_FOLDER_CAHIER_30_ANS=$DRIVE_FOLDER_CAHIER_30_ANS" >> .env
          [ -n "$DRIVE_FOLDER_MAIN" ] && echo "DRIVE_FOLDER_MAIN=$DRIVE_FOLDER_MAIN" >> .env

          cd android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" > key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> key.properties
          echo "storeFile=upload-keystore.jks" >> key.properties

      - name: Install dependencies
        working-directory: apps/mobile_app
        run: flutter pub get

      # --- STEP 1: Build the AAB (The "Source of Truth") ---
      - name: Build App Bundle
        working-directory: apps/mobile_app
        run: flutter build appbundle --release

      # --- STEP 2: Upload to Google Play IMMEDIATELY ---
      # We do this BEFORE generating the APK. If this fails, the pipeline stops.
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          packageName: com.lebontemperament.app
          # Use the standard Flutter build path since we haven't renamed it yet
          releaseFiles: apps/mobile_app/build/app/outputs/bundle/release/app-release.aab
          mappingFile: apps/mobile_app/build/app/outputs/mapping/release/mapping.txt
          track: internal
          status: draft

      # --- STEP 3: Generate APK from AAB (Optimization) ---
      # We skip 'flutter build apk' to save time, and instead convert the AAB.
      - name: Generate APK from AAB
        working-directory: apps/mobile_app
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # 1. Download Bundletool
          wget https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar

          # 2. FIX: Create the output directory explicitly (Flutter doesn't create it for AAB builds)
          mkdir -p build/app/outputs/flutter-apk

          # 3. Convert AAB to APKS (Universal Mode)
          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=app.apks \
            --mode=universal \
            --ks=android/upload-keystore.jks \
            --ks-pass=pass:"$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass=pass:"$ANDROID_KEY_PASSWORD"
            
          # 4. Extract the single APK
          unzip -p app.apks universal.apk > build/app/outputs/flutter-apk/app-release.apk

      # --- STEP 4: Rename and Release ---
      - name: Rename Artifacts
        id: rename
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Define paths
          AAB_OLD="apps/mobile_app/build/app/outputs/bundle/release/app-release.aab"
          AAB_NEW="apps/mobile_app/build/app/outputs/bundle/release/BT-App-v${VERSION}.aab"

          APK_OLD="apps/mobile_app/build/app/outputs/flutter-apk/app-release.apk"
          APK_NEW="apps/mobile_app/build/app/outputs/flutter-apk/BT-App-v${VERSION}.apk"

          # Rename files
          mv $AAB_OLD $AAB_NEW
          mv $APK_OLD $APK_NEW

          # Output for GitHub Release
          echo "aab_path=$AAB_NEW" >> $GITHUB_OUTPUT
          echo "apk_path=$APK_NEW" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "android/v${{ steps.version.outputs.version }}"
          name: "Android v${{ steps.version.outputs.version }}"
          files: |
            ${{ steps.rename.outputs.aab_path }}
            ${{ steps.rename.outputs.apk_path }}
          generate_release_notes: true
