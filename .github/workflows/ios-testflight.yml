name: iOS TestFlight

# Builds the iPhone app, signs it for the App Store, uploads it to
# TestFlight and sends it to the members' external group, submitting it for
# Apple's beta review when it needs one (fastlane, apps/mobile_app/ios/fastlane).
# Runs on each release to main that touches the app, like the Android build,
# or by hand from Actions. By hand, "Build and upload for internal testers
# only" skips the members; "Send the latest build to members" only does that
# step (to retry it); "Show the TestFlight status" lists the latest builds
# with Apple's state for each, read-only; "Update the App Store page" fills
# the App Store version being prepared (texts, screenshots, age rating,
# build) without submitting it; "Set up delivery links" turns on Associated
# Domains for the app's identifier and saves its App ID as an artifact for
# the website's apple-app-site-association (#593). See
# apps/mobile_app/ios/fastlane/README.md.
#
# It changes App Store Connect, so the job runs in the `app-store`
# environment, which holds the API key and waits for the owner's approval.

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobile_app/**"
      - "!apps/mobile_app/pubspec.yaml"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        default: Build and upload
        options:
          - Build and upload
          - Build and upload for internal testers only
          - Send the latest build to members
          - Show the TestFlight status
          - Update the App Store page
          - Set up delivery links

permissions:
  contents: read

concurrency:
  group: app-store
  cancel-in-progress: false

jobs:
  testflight:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: ${{ inputs.action && inputs.action != 'Build and upload' && inputs.action || 'Build and upload to TestFlight' }}
    runs-on: macos-26
    timeout-minutes: 90
    environment: app-store
    env:
      # Only the two "Build and upload" choices (and a push to main) build the app.
      BUILD: ${{ !inputs.action || startsWith(inputs.action, 'Build and upload') }}
      SEND_TO_MEMBERS: ${{ inputs.action != 'Build and upload for internal testers only' }}
      ACTION: ${{ inputs.action || 'Build and upload' }}
      # Same fixed production website as the Android build.
      SITE_URL: https://www.lebontemperament.com
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing secrets in the app-store environment:$missing" >&2
            exit 1
          fi
          xcodebuild -version

      - name: Setup Flutter
        if: env.BUILD == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          cache: true

      - name: Create .env
        if: env.BUILD == 'true'
        working-directory: apps/mobile_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DRIVE_FOLDER_ADULTES: ${{ secrets.DRIVE_FOLDER_ADULTES }}
          DRIVE_FOLDER_JEUNES: ${{ secrets.DRIVE_FOLDER_JEUNES }}
          DRIVE_FOLDER_ENFANTS: ${{ secrets.DRIVE_FOLDER_ENFANTS }}
          DRIVE_FOLDER_ORCHESTRE: ${{ secrets.DRIVE_FOLDER_ORCHESTRE }}
          DRIVE_FOLDER_CAHIER_30_ANS: ${{ secrets.DRIVE_FOLDER_CAHIER_30_ANS }}
          DRIVE_FOLDER_MAIN: ${{ secrets.DRIVE_FOLDER_MAIN }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "SITE_URL=$SITE_URL" >> .env
          [ -n "$DRIVE_FOLDER_ADULTES" ] && echo "DRIVE_FOLDER_ADULTES=$DRIVE_FOLDER_ADULTES" >> .env
          [ -n "$DRIVE_FOLDER_JEUNES" ] && echo "DRIVE_FOLDER_JEUNES=$DRIVE_FOLDER_JEUNES" >> .env
          [ -n "$DRIVE_FOLDER_ENFANTS" ] && echo "DRIVE_FOLDER_ENFANTS=$DRIVE_FOLDER_ENFANTS" >> .env
          [ -n "$DRIVE_FOLDER_ORCHESTRE" ] && echo "DRIVE_FOLDER_ORCHESTRE=$DRIVE_FOLDER_ORCHESTRE" >> .env
          [ -n "$DRIVE_FOLDER_CAHIER_30_ANS" ] && echo "DRIVE_FOLDER_CAHIER_30_ANS=$DRIVE_FOLDER_CAHIER_30_ANS" >> .env
          [ -n "$DRIVE_FOLDER_MAIN" ] && echo "DRIVE_FOLDER_MAIN=$DRIVE_FOLDER_MAIN" >> .env
          true

      # Compiles the Flutter part and installs the pods; fastlane then
      # archives and signs. Until the store launch (3.0.0), the iOS version
      # stays at version.json's `iosVersion`, the version Apple's beta review
      # already approved for members: each upload is then a new build of that
      # version, which members get without a new full review. The build
      # number still comes from pubspec.yaml, shared with Android.
      - name: Build (unsigned)
        if: env.BUILD == 'true'
        working-directory: apps/mobile_app
        run: |
          IOS_VERSION=$(node -p "require('../../version.json').iosVersion || ''")
          flutter pub get
          if [ -n "$IOS_VERSION" ]; then
            if ! printf '%s' "$IOS_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "version.json iosVersion is not x.y.z: $IOS_VERSION" >&2
              exit 1
            fi
            echo "iOS version frozen at $IOS_VERSION (version.json iosVersion)"
            echo "IOS_VERSION=$IOS_VERSION" >> "$GITHUB_ENV"
            flutter build ios --release --no-codesign --build-name "$IOS_VERSION"
          else
            flutter build ios --release --no-codesign
          fi

      - name: Install fastlane
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile_app/ios

      - name: Run fastlane (upload, send to members, status, or App Store page)
        working-directory: apps/mobile_app/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc-key.p8"
          ( umask 077; printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH" )
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          case "$ACTION" in
            "Send the latest build to members") bundle exec fastlane ios members ;;
            "Show the TestFlight status") bundle exec fastlane ios status ;;
            "Update the App Store page") bundle exec fastlane ios store ;;
            "Set up delivery links") APP_LINKS_OUT="$RUNNER_TEMP/app-links/app-id.txt" && mkdir -p "$RUNNER_TEMP/app-links" && export APP_LINKS_OUT && bundle exec fastlane ios app_links ;;
            *) bundle exec fastlane ios beta ;;
          esac

      # The App ID prefix is the team ID, which GitHub masks in the logs.
      - name: Upload the App ID
        if: env.ACTION == 'Set up delivery links'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-links
          path: ${{ runner.temp }}/app-links/app-id.txt
          retention-days: 7
          if-no-files-found: error
