name: mobile_app
description: "A new Flutter project."
publish_to: "none"

version: 2.0.29+45
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Core
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  url_launcher: ^6.3.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # State Management (Aligned versions for compatibility)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.4

  # Supabase & Networking
  supabase_flutter: ^2.5.5
  dio: ^5.4.3+1

  # Local Storage (Aligned versions)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Utilities
  logger: ^2.3.0
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  flutter_dotenv: ^5.1.0
  get_it: ^7.7.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  uuid: ^4.4.0

  # Permissions & Notifications
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

  # Feature Specific
  audioplayers: ^6.0.0
  pdfx: ^2.9.2
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation (Aligned versions for compatibility)
  build_runner: ^2.4.10
  # FIXED: Downgraded riverpod_generator to be compatible with hive_generator
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1 # This can now coexist
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # Testing
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - .env
