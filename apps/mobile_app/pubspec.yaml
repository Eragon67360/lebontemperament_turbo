name: lebontemperament
description: "Application mobile du Bon Tempérament"
publish_to: "none"

version: 2.0.137+154
environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Core
  google_fonts: ^8.0.1
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  url_launcher: ^6.3.3
  cached_network_image: ^3.4.1

  # State Management
  flutter_riverpod: ^3.2.1

  # Navigation
  go_router: ^17.1.0

  # Supabase & Networking
  supabase_flutter: ^2.18.0
  dio: ^5.11.1

  # Social sign-in: Google through the system browser sheet
  # (ASWebAuthenticationSession / Custom Tabs), Apple natively on iOS.
  flutter_web_auth_2: ^5.1.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7

  # Local Storage (Aligned versions)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.4

  # Utilities
  logger: ^2.8.0
  connectivity_plus: ^7.3.1
  package_info_plus: ^9.0.0
  flutter_dotenv: ^6.0.1
  get_it: ^9.3.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  uuid: ^4.6.0

  # Firebase (FCM push notifications)
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.5

  # Permissions & Notifications
  permission_handler: ^12.0.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

  # Feature Specific
  audioplayers: ^6.8.1
  pdfx: ^2.11.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  share_plus: ^10.1.4
  # Screenshots attached to a signalement (system photo picker).
  image_picker: ^1.2.2

  # Liquid Glass tab bar on iOS 26 and later (shader drawn by Flutter).
  cupertino_native_better: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation (Aligned versions for compatibility)
  build_runner: ^2.4.10
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - .env
    # Bundled so google_fonts never fetches them from Google's servers at
    # runtime (offline first launch, no request to Google); SIL OFL 1.1.
    - assets/google_fonts/
