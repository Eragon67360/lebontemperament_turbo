name: lebontemperament
description: "Application mobile du Bon Tempérament"
publish_to: "none"

version: 2.0.62+78
environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Core
  google_fonts: ^8.0.1
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # State Management (Aligned versions for compatibility)
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.1.0

  # Supabase & Networking
  supabase_flutter: ^2.12.0
  dio: ^5.9.1

  # Local Storage (Aligned versions)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.4

  # Utilities
  logger: ^2.6.2
  connectivity_plus: ^7.0.0
  package_info_plus: ^9.0.0
  flutter_dotenv: ^6.0.0
  get_it: ^9.2.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  uuid: ^4.5.2

  # Firebase (FCM push notifications)
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.5

  # Permissions & Notifications
  permission_handler: ^12.0.1
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Feature Specific
  audioplayers: ^6.0.0
  pdfx: ^2.9.2
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation (Aligned versions for compatibility)
  build_runner: ^2.4.10
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # Testing
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - .env
